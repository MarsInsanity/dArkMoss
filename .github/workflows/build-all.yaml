# Builds the units in parallel and publishes them as the beta-<branch>
# prerelease. Promote a beta with create-latest-release.yaml.

name: build-all

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version stamped into the images, e.g. v1.1.3"
        required: true
      units:
        description: "Comma-separated units (blank = every unit in .github/units.txt)"
        required: false
        default: ""
      replace:
        description: "Swap only these units into the current beta of the same version"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      units: ${{ steps.units.outputs.units }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::version must look like v1.2.3"; exit 1; }
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::$VERSION is already released"; exit 1
          fi

      - name: Pick the units
        id: units
        env:
          UNITS: ${{ inputs.units }}
        run: |
          if [ -z "$UNITS" ]; then
            UNITS="$(grep -v '^\s*$' .github/units.txt | paste -sd,)"
          fi
          json="$(jq -Rc 'split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))' <<<"$UNITS")"
          for u in $(jq -r '.[]' <<<"$json"); do
            grep -qx "$u" .github/units.txt || { echo "::error::$u is not in .github/units.txt"; exit 1; }
          done
          echo "units=$json" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        unit: ${{ fromJSON(needs.plan.outputs.units) }}
    uses: ./.github/workflows/build-image.yaml
    with:
      unit: ${{ matrix.unit }}
      version: ${{ inputs.version }}

  publish:
    needs: [plan, build]
    # A failed unit just has no artifact; the beta gets whatever built.
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Collect the images
        uses: actions/download-artifact@v4
        with:
          pattern: dArkMoss-*
          merge-multiple: true

      # The V10 and the RG351P share one card with spruce: add their install steps
      # to the notes. While a unit's spruce files are not in a spruce release, a
      # fork can carry them on a branch named after the unit ("v10", "rg351p") of
      # <owner>/spruceOS; when that branch exists its files are attached as
      # spruce-<UNIT>-overlay.zip. Without it a unit gets its notes only.
      - name: Check out (release notes)
        if: ${{ contains(needs.plan.outputs.units, '"v10"') || contains(needs.plan.outputs.units, '"rg351p"') }}
        uses: actions/checkout@v4
        with:
          path: src

      - name: Single-card notes and spruce overlays
        if: ${{ contains(needs.plan.outputs.units, '"v10"') || contains(needs.plan.outputs.units, '"rg351p"') }}
        env:
          OVERLAY_REPO: ${{ github.repository_owner }}/spruceOS
          UNITS: ${{ needs.plan.outputs.units }}
        run: |
          for unit in v10 rg351p; do
            jq -e --arg u "$unit" 'index($u) != null' <<<"$UNITS" >/dev/null || continue
            UNIT_UC="${unit^^}"
            cp "src/.github/${unit}-release-notes.md" "${unit}-notes.md"
            if ! git ls-remote --exit-code --heads "https://github.com/${OVERLAY_REPO}" "$unit" >/dev/null 2>&1; then
              echo "No ${unit} branch on ${OVERLAY_REPO}: no ${UNIT_UC} overlay attached"
              continue
            fi
            rm -rf spruce-src
            GIT_LFS_SKIP_SMUDGE=1 git clone -q --filter=blob:none --no-checkout -b "$unit" "https://github.com/${OVERLAY_REPO}" spruce-src
            (
              cd spruce-src
              git fetch -q origin Development
              base="$(git merge-base FETCH_HEAD HEAD)"
              git diff --name-only --diff-filter=ACMR "$base" HEAD > "../overlay-files-${unit}.txt"
              [ -s "../overlay-files-${unit}.txt" ] || { echo "::error::no ${UNIT_UC} files on ${OVERLAY_REPO} ${unit}"; exit 1; }
              tr '\n' '\0' < "../overlay-files-${unit}.txt" | xargs -0 git archive --format=zip -o "../spruce-${UNIT_UC}-overlay.zip" HEAD --
            )
            rm -rf spruce-src
            unzip -l "spruce-${UNIT_UC}-overlay.zip" | tail -1
            cat "src/.github/${unit}-overlay-note.md" >> "${unit}-notes.md"
          done

      - name: Checksums
        run: |
          shopt -s nullglob
          imgs=( *.img.7z* )
          [ ${#imgs[@]} -gt 0 ] || { echo "::error::no unit produced an image"; exit 1; }
          extra=( spruce-*-overlay.zip )
          sha256sum *.img.7z* *.dmupd "${extra[@]}" > SHA256SUMS
          ls -lh *.img.7z* *.dmupd SHA256SUMS

      - name: Publish the beta
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: beta-${{ github.ref_name }}
          VERSION: ${{ inputs.version }}
          UNITS: ${{ needs.plan.outputs.units }}
          REPLACE: ${{ inputs.replace }}
        run: |
          if [ "$REPLACE" = true ]; then
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body > notes.md \
              || { echo "::error::no $TAG to update"; exit 1; }
            grep -qx "Version: ${VERSION}" notes.md || { echo "::error::$TAG is not ${VERSION}"; exit 1; }
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p SHA256SUMS -O old.sums
            for u in $(jq -r '.[]' <<<"$UNITS"); do
              prefix="dArkMoss_${u^^}_"
              gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' \
                | grep "^${prefix}" | while read -r a; do
                  gh release delete-asset "$TAG" "$a" --repo "$GITHUB_REPOSITORY" --yes
                done
              grep -v "  ${prefix}" old.sums > old.tmp || true
              mv old.tmp old.sums
            done
            cat old.sums SHA256SUMS | sort -k2 > merged.sums
            mv merged.sums SHA256SUMS
            shopt -s nullglob
            extra=( spruce-*-overlay.zip )
            gh release upload "$TAG" *.img.7z* *.dmupd "${extra[@]}" SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
            echo "Rebuilt $(jq -r 'join(" ")' <<<"$UNITS") at ${GITHUB_SHA}" >> notes.md
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
            exit 0
          fi
          # Asset names carry the date and version, so start from an empty release.
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes 2>/dev/null || true
          cat > notes.md <<EOF
          Beta build from \`${GITHUB_REF_NAME}\`. Not for general use.

          Version: ${VERSION}
          Commit: ${GITHUB_SHA}
          Units: $(jq -r 'join(" ")' <<<"$UNITS")
          EOF
          [ -f v10-notes.md ] && cat v10-notes.md >> notes.md
          [ -f rg351p-notes.md ] && cat rg351p-notes.md >> notes.md
          shopt -s nullglob
          extra=( spruce-*-overlay.zip )
          gh release create "$TAG" *.img.7z* *.dmupd "${extra[@]}" SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Beta Build (${GITHUB_REF_NAME}) ${VERSION}" \
            --notes-file notes.md \
            --prerelease \
            --latest=false
