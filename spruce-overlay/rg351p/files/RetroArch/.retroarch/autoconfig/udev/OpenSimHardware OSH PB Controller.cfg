# Anbernic RG351P internal pad: a USB HID controller (1209:3100), d-pad on a
# hat. A is the right face button. Numbering is RetroArch's udev joypad driver
# (input/drivers_joypad/udev_joypad.c), which numbers KEY_UP..KEY_DOWN first,
# then every key from BTN_MISC up. This pad also declares those six arrow keys
# and nine mouse buttons (272-280), so its buttons 304-315 are 15-26, not the
# 0-11 of ArkOS's older RetroArch (checked on hardware: with 0-11 only the hat
# d-pad and the stick worked).
input_driver = "udev"
input_device = "OpenSimHardware OSH PB Controller"
input_vendor_id = "4617"
input_product_id = "12544"

input_a_btn = "15"
input_b_btn = "16"
input_x_btn = "17"
input_y_btn = "18"

input_l_btn = "19"
input_r_btn = "20"
input_l2_btn = "25"
input_r2_btn = "26"
input_l3_btn = "23"
input_r3_btn = "24"

input_start_btn = "21"
input_select_btn = "22"

input_up_btn = "h0up"
input_down_btn = "h0down"
input_left_btn = "h0left"
input_right_btn = "h0right"

input_l_x_plus_axis = "+0"
input_l_x_minus_axis = "-0"
input_l_y_plus_axis = "+1"
input_l_y_minus_axis = "-1"

input_a_btn_label = "A"
input_b_btn_label = "B"
input_x_btn_label = "X"
input_y_btn_label = "Y"
input_start_btn_label = "Start"
input_select_btn_label = "Select"
input_l_btn_label = "L1"
input_r_btn_label = "R1"
input_l2_btn_label = "L2"
input_r2_btn_label = "R2"
input_l3_btn_label = "L3"
input_up_btn_label = "D-Pad Up"
input_down_btn_label = "D-Pad Down"
input_left_btn_label = "D-Pad Left"
input_right_btn_label = "D-Pad Right"
input_l_x_plus_axis_label = "Left Analog Right"
input_l_x_minus_axis_label = "Left Analog Left"
input_l_y_plus_axis_label = "Left Analog Down"
input_l_y_minus_axis_label = "Left Analog Up"
